<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard - Price Lister">
    <title>Dashboard - Price Lister</title>
    <link rel="stylesheet" href="theme.css">

    <!-- Import Maps -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js",
        "firebase/analytics": "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.0"
      }
    }
    </script>
</head>

<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">Price Lister</div>
            <div class="nav-item active" id="nav-products">📦 Products</div>
            <div class="nav-item" id="nav-invoices">📄 Invoices</div>
            <div class="nav-item" id="nav-clients">👥 Clients</div>
            <div style="flex-grow: 1;"></div>
            <div class="user-info" style="margin-bottom: 20px;">
                <p id="userNameDisplay" style="font-weight: bold; color: var(--text-main); font-size: 0.9rem;"></p>
                <p id="userEmailDisplay" style="color: var(--text-muted); font-size: 0.8rem;"></p>
            </div>
            <button id="logoutBtn" class="btn-primary" style="width: 100%; font-size: 0.9rem; padding: 10px;">➔ Log
                Out</button>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <header class="header">
                <h1 id="pageTitle">Inventory Overview</h1>
                <button class="btn-primary" id="addBtn">+ Add Item</button>
            </header>

            <div class="content-area">
                <div id="loadingIndicator" class="loader"></div>
                <div id="dataContainer" class="data-grid" style="display: none;">
                    <!-- Cloud Data Injected Here -->
                </div>
            </div>
        </main>
    </div>

    <!-- App Logic -->
    <script type="module">
        import { auth, signOut, onAuthStateChanged } from "./firebaseConfig.js";
        import { getActiveWorkspaceUid, listenToProducts } from "./workspaceService.js";

        const logoutBtn = document.getElementById('logoutBtn');
        const dataContainer = document.getElementById('dataContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const pageTitle = document.getElementById('pageTitle');
        const addBtn = document.getElementById('addBtn');

        let currentUser = null;
        let unsubscribeProducts = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html"; // Redirect to login
            } else {
                currentUser = user;
                document.getElementById('userNameDisplay').innerText = user.displayName || 'User';
                document.getElementById('userEmailDisplay').innerText = user.email || '';

                // Initialize Workspace Data
                await loadDashboard(user.uid);
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = "index.html";
        });

        async function loadDashboard(uid) {
            loadingIndicator.style.display = 'block';
            dataContainer.style.display = 'none';

            try {
                const workspaceId = await getActiveWorkspaceUid(uid);

                // Listen to Products as default view
                unsubscribeProducts = listenToProducts(workspaceId, (products) => {
                    renderProducts(products);
                });
            } catch (error) {
                console.error("Error loading workspace:", error);
                loadingIndicator.style.display = 'none';
                dataContainer.style.display = 'flex';
                dataContainer.innerHTML = `<p style="color:red">Error loading workspace data.</p>`;
            }
        }

        function renderProducts(products) {
            loadingIndicator.style.display = 'none';
            dataContainer.style.display = 'grid';
            dataContainer.innerHTML = '';

            if (products.length === 0) {
                dataContainer.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1;">No products found in this workspace.</p>`;
                return;
            }

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-title">${product.name || 'Unnamed Product'}</div>
                    <div class="product-meta">
                        <span>Qty: <b>${product.quantity || 0}</b></span>
                        <span class="badge">${product.category || 'Uncategorized'}</span>
                    </div>
                    <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end;">
                        <div>
                            <div style="font-size: 0.8rem; color: var(--text-muted)">Selling Price</div>
                            <div class="product-price">$${product.salePrice || 0}</div>
                        </div>
                    </div>
                `;
                dataContainer.appendChild(card);
            });
        }
    </script>
</body>

</html>
