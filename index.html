<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Price Lister - The complete business inventory and invoice management app.">
    <title>Price Lister | Organize effortlessly</title>
    <link rel="stylesheet" href="theme.css">

    <!-- Import Maps for ES Modules (Firebase / Supabase CDN) -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js",
        "firebase/analytics": "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.0"
      }
    }
    </script>
</head>

<body>

    <main class="hero container glass-card" style="margin-top: 50px; text-align: center;">
        <h1>Price Lister</h1>
        <p>The premium business application to list, organize, and manage your products and client invoices seamlessly
            from any device.</p>

        <button id="loginBtn" class="btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4" />
                <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853" />
                <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    fill="#FBBC05" />
                <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335" />
            </svg>
            Sign in with Google
        </button>
        <div id="loadingIndicator" class="loader" style="display: none;"></div>
        <p id="errorMsg" style="color: var(--primary-color); margin-top: 10px;"></p>
    </main>

    <!-- App Logic -->
    <script type="module">
        import { auth, googleProvider, signInWithPopup, onAuthStateChanged } from "./firebaseConfig.js";

        const loginBtn = document.getElementById('loginBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorMsg = document.getElementById('errorMsg');

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "app.html";
            }
        });

        loginBtn.addEventListener('click', async () => {
            loginBtn.style.display = 'none';
            loadingIndicator.style.display = 'block';
            errorMsg.innerText = '';
            try {
                const result = await signInWithPopup(auth, googleProvider);
                if (result.user) {
                    window.location.href = "app.html";
                }
            } catch (error) {
                console.error("Login failed:", error);
                errorMsg.innerText = "Error: " + error.code + " - " + error.message;
                loginBtn.style.display = 'inline-flex';
                loadingIndicator.style.display = 'none';
            }
        });
    </script>
</body>

</html>
